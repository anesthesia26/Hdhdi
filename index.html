<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صارحني - رسالة سرية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h2 { text-align: center; margin-bottom: 10px; font-weight: 600; }
        p.subtitle { text-align: center; font-size: 14px; color: #ddd; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #eee; }
        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        input[type="file"] {
            padding: 8px;
            cursor: pointer;
        }
        input:focus, textarea:focus { border-color: #00d2ff; background: rgba(255, 255, 255, 0.12); }
        textarea { resize: none; height: 100px; }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="container">
        <h2>صارحني</h2>
        <p class="subtitle">أرسل رسالة سرية أو صورة بدون أن نعرف من هو المرسل</p>

        <!-- الإرسال المباشر بدون تعقيد الجافاسكريبت -->
        <form action="https://formspree.io/f/xljeazzv" method="POST" enctype="multipart/form-data">
            
            <div class="form-group">
                <label for="name">الاسم أو اللقب (اختياري):</label>
                <input type="text" id="name" name="name" placeholder="فاعل خير، صديق...">
            </div>

            <div class="form-group">
                <label for="message">نص الرسالة:</label>
                <textarea id="message" name="message" placeholder="اكتب رسالتك هنا..." required></textarea>
            </div>

            <div class="form-group">
                <label for="attachment">إرفاق صورة أو ملف (اختياري):</label>
                <input type="file" id="attachment" name="upload" accept="image/*">
            </div>

            <button type="submit">إرسال سري</button>
        </form>
    </div>

</body>
</html>
